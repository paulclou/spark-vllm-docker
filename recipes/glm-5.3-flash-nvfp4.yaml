# GLM-5.3-Flash serve - NVIDIA's official NVFP4 checkpoint and serving setup
# (nvidia/GLM-5.3-Flash-NVFP4 model card, vLLM section, 2026-09-09).
#
# Contract: NVIDIA's command verbatim EXCEPT image (tonyd2wild build = the
# official vllm/vllm-openai:glm53-flash-arm64-cu130 image + DFlash2 + sm121
# patches, same vLLM commit) and TP x nodes (4 x 1-GPU Sparks; node wiring
# generated by launch-cluster.sh). Flag-by-flag mapping, evidence, and
# validation status: docs/GLM53_FLASH.md ("NVIDIA official setup port").
#
# GB10-forced deviations from NVIDIA's values (not tuning):
#   --gpu-memory-utilization 0.85 (NVIDIA 0.90) - vLLM default exceeds UMA
#     free memory; engine refuses to start.
#   --moe-backend marlin - sm_121 auto-select emits silent garbage.
#   HF_HUB_OFFLINE=1 - our equivalent of NVIDIA's local /checkpoint path;
#     Glm5NextProcessor needs local-path resolution.
#   mods/fix-glm53-topk-sm120 - >32K requests crash without it (issue #27).
#
# Additions NVIDIA's command does not carry:
#   --tool-call-parser glm47 + auto tool choice (NVIDIA's SGLang section
#     names glm47; vLLM needs the parser for auto tool choice).
#   DFlash2 k=7 speculative decoding (owner choice; drafter is CC BY-NC-ND.
#     The checkpoint ships one MTP layer: method "mtp" is the commercial
#     fallback). --max-model-len 1048576 explicit, --enable-prefix-caching
#     stated, clear_thinking=true, served-model-name alias.
# 2026-09-11: NOT booted yet - first launch foreground, then the benchmark
# suite in docs/GLM53_FLASH.md against the 2026-08-30 LibertAIDAI table.

recipe_version: "1"
name: GLM-5.3-Flash-NVFP4
description: GLM-5.3-Flash NVFP4 on 4x Spark - nvidia/GLM-5.3-Flash-NVFP4 with NVIDIA's official vLLM setup; image and topology adapted to GB10

model: nvidia/GLM-5.3-Flash-NVFP4
container: vllm-node-glm5.3-flash

cluster_only: true

mods:
  - mods/fix-glm53-topk-sm120
  # mods/fix-nvfp4-moe-global-scale (vLLM #54150) is deliberately NOT applied:
  # NVIDIA's checkpoint has identical gate/up per-expert global scales
  # (measured 2026-09-11, 864/864 pairs across 3 layers), so the bug cannot
  # trigger. Re-add it if the checkpoint ever changes.
  # kpool tail slot-map clamp (silent corruption on generations >~2K tokens,
  # mechanism credited to vcruz305) + XGrammar termination backports.
  # Vendored from Mia's overlay; exonerated of side effects by the KV A/B.
  - mods/mia-backports-20260830

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  data_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 1048576
  max_num_seqs: 32
  max_num_batched_tokens: 8192
  loader_threads: 128

env:
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  # Glm5NextProcessor open()s files relative to the model argument; offline
  # mode makes vLLM resolve the HF id to the local snapshot first. Without
  # it the API server crashes on processor_config.json at boot.
  HF_HUB_OFFLINE: "1"

# NVIDIA's command in NVIDIA's order; GB10 and additions appended.
command: |
  vllm serve nvidia/GLM-5.3-Flash-NVFP4 \
      --served-model-name glm-5.3-flash-nvfp4 \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --data-parallel-size {data_parallel} \
      --enable-expert-parallel \
      --enable-ep-weight-filter \
      --reasoning-parser glm45 \
      --kv-cache-dtype fp8 \
      --model-loader-extra-config '{{"enable_multithread_load": true, "num_threads": {loader_threads}}}' \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --enable-chunked-prefill \
      --max-num-seqs {max_num_seqs} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --moe-backend marlin \
      --max-model-len {max_model_len} \
      --enable-prefix-caching \
      --tool-call-parser glm47 \
      --enable-auto-tool-choice \
      --speculative-config '{{"method":"dflash","model":"incoai/GLM-5.3-Flash-DFlash2","num_speculative_tokens":7,"draft_sample_method":"probabilistic","rejection_sample_method":"standard"}}' \
      --default-chat-template-kwargs '{{"clear_thinking": true}}'
