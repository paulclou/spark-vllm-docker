# GLM-5.3-Flash serve - replication of the official vLLM recipe
# (recipes.vllm.ai GLM-5.3-Flash, multi-node TP profile).
#
# Contract (Paul, 2026-08-30): replicate the official recipe EXCEPT
#   1. image      - official x86 vllm/vllm-openai:glm53-flash cannot run on
#                   aarch64 GB10; tonyd2wild sm121 build via
#                   PREBUILT_RUNNER_IMAGE=ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v11-dflash2 \
#                     ./build-and-copy.sh -t vllm-node-glm5.3-flash -c
#   2. checkpoint - LibertAIDAI NVFP4 (official offers RedHatAI NVFP4/FP8/BF16)
#   3. TP x nodes - 4 x 1-GPU Sparks (official example: 8 x 2); node wiring
#                   (--nnodes/--node-rank/--master-addr, IFACE env) is
#                   generated per node by launch-cluster.sh
# Everything else replicates the official command; vLLM defaults untouched.
#
# Tuning deviations (Paul, 2026-08-30):
#   --max-num-seqs 16 (vLLM default 128) - fleet-serving cap consistent
#     with ds4f-1m; GB10 aggregate decode saturates well below 128 streams.
#   --max-num-batched-tokens 8192 (vLLM default 2048) - 4x faster
#     long-prompt prefill (tony's validated value).
#
# Serving choices (Paul, 2026-08-30): --served-model-name glm-5.3-flash-nvfp4
# (official omits; clients get a stable alias). Thinking is ALWAYS ON in
# this model (no enable_thinking in the template); clients dial it with
# chat_template_kwargs {"reasoning_effort": "low"|"high"|"max"} (default
# max; probe: low = ~50 think tokens / 1.5s vs max ~310 / 7.8s).
# clear_thinking=true strips prior turns' think blocks from the prompt
# (zai's chat recommendation; content is untouched).
# --reasoning-parser deepseek_r1, NOT glm45: probed 2026-08-30 - glm45 on
# vLLM silently discards the think block (reasoning_content empty, ~300
# tokens lost per reply); deepseek_r1 per LibertAI's card. Doc priority
# for deviations: vLLM official -> LibertAI -> Mia -> tony (Paul).
#
# GB10-mandatory: --gpu-memory-utilization 0.85 - vLLM's default (0.92 in
# this build, 111.95 GiB) exceeds GB10 UMA free memory at boot (110.19 of
# 121.69 GiB; host owns the rest) and the engine refuses to start. 0.85 is
# the tony-validated value all measured results used.
#
# Two survival additions, both boot/correctness-mandatory on this stack
# (not tuning): --trust-remote-code (LibertAIDAI checkpoint refuses to load
# without it) and --moe-backend marlin (sm_121 auto-select emits silent
# garbage). mods/fix-glm53-topk-sm120 rides the launcher, not the command
# (>32K requests crash the engine without it; issue #27).

recipe_version: "1"
name: GLM-5.3-Flash-Serve
description: GLM-5.3-Flash on 4x Spark - official vLLM recipe replicated; image, checkpoint, and topology adapted

model: LibertAIDAI/GLM-5.3-Flash-NVFP4
container: vllm-node-glm5.3-flash

cluster_only: true

mods:
  - mods/fix-glm53-topk-sm120

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.85
  max_num_seqs: 16
  max_num_batched_tokens: 8192

env:
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  # Survival addition: Glm5NextProcessor open()s files relative to the model
  # argument; offline mode makes vLLM resolve the HF id to the local snapshot
  # first. tonyd2wild's launcher sets this too (plus TRANSFORMERS_OFFLINE).
  # Without it the API server crashes on processor_config.json at boot.
  HF_HUB_OFFLINE: "1"

command: |
  vllm serve LibertAIDAI/GLM-5.3-Flash-NVFP4 \
      --served-model-name glm-5.3-flash-nvfp4 \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --tensor-parallel-size {tensor_parallel} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --kv-cache-dtype fp8 \
      --moe-backend marlin \
      --tool-call-parser glm47 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_r1 \
      --speculative-config '{{"method":"mtp","num_speculative_tokens":5}}' \
      --default-chat-template-kwargs '{{"clear_thinking": true}}'
