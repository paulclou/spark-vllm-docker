# Recipe: DeepSeek V4 Flash 0731
# DeepSeek V4 Flash using the B12X-optimized serving stack on an SM121 cluster

recipe_version: "1"
name: DeepSeek-V4-Flash-0731
description: vLLM serving deepseek-ai/DeepSeek-V4-Flash-0731 on a dual Sparks using B12X docker

model: deepseek-ai/DeepSeek-V4-Flash-0731
# PINNED IMAGE — do not float back to vllm-node-b12x (= b12x :latest) until
# eugr/spark-vllm-docker#356 is fixed. The 20260813-20260815 b12x nightlies
# episodically garble under concurrent traffic: spec-decode mean acceptance
# collapses to ~1.0 for minutes (healthy 2.5-5), output degenerates into
# repetition/CJK salad/leaked <|DSML|> markup, with ZERO log errors, then
# self-recovers. Measured here 2026-08-23 on the d20260815 image: 8 sustained
# episodes in ~9h, onset typically when a request finishes mid-batch;
# reproduced on BOTH ds4f recipes, so recipe config is exonerated.
#   bad:        nightly-20260813, nightly-20260815 (garble within 30min-hours)
#   good:       nightly-20260810 (4 named rollback confirmations),
#               nightly-20260812 (clean over "a billion tokens", forum)
#   unverified: nightly-20260822+ (:latest) — canary before ever unpinning
# Refs: eugr/spark-vllm-docker#356 - NVIDIA forum topic 376220 (p4-5) -
# local-inference-lab/rtx6kpro#53 - paulclou/spark-vllm-docker#17.
container: eugr/spark-vllm-b12x:nightly-20260812

build_args:
  - --exp-b12x

cluster_only: true

mods:
  - mods/instanttensor-hybrid-draft-loader
#   - mods/drop-caches

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: auto
  block_size: 256
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 64
  num_speculative_tokens: 5

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOE_SKIP_PADDING: "0"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}'
