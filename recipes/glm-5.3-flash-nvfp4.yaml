# GLM-5.3-Flash serve - NVIDIA's official NVFP4 checkpoint and serving setup
# (nvidia/GLM-5.3-Flash-NVFP4 model card, vLLM section, 2026-09-09).
#
# Contract: replicate NVIDIA's command EXCEPT image (NVIDIA's x86 GB200 path
# cannot run on aarch64 GB10; tonyd2wild sm121-v11-dflash2 build) and
# TP x nodes (4 x 1-GPU Sparks; node wiring generated by launch-cluster.sh).
# Flag-by-flag mapping, rationale, and validation status:
# docs/GLM53_FLASH.md ("NVIDIA official setup port").
#
# Checkpoint: 204 GB (~51 GiB/node at TP=4), ModelOpt 0.47, routed experts +
# dense MLP in NVFP4, FP8 KV. Card pins transformers>=5.16.1; the image has
# 5.15.1 - unverified whether vLLM needs the pin. Not yet in any node's HF
# cache; the DFlash2 drafter is (same base model, acceptance may shift).
#
# Reference ports the previous (LibertAIDAI) form was measured against live
# in docs/reference-recipes/ - kept for provenance, not launchable.
#
# Boot/correctness-mandatory on GB10 (not tuning):
#   --gpu-memory-utilization 0.85 (NVIDIA 0.90) - vLLM default exceeds UMA
#     free memory; engine refuses to start.
#   --moe-backend marlin - sm_121 auto-select emits silent garbage.
#   --trust-remote-code - NVIDIA's card omits it (no remote code in the
#     repo); kept because the sibling ModelOpt checkpoint refused to load
#     without it on this image. Harmless if unneeded.
#   HF_HUB_OFFLINE=1 - Glm5NextProcessor needs local-path resolution.
#   mods/fix-glm53-topk-sm120 - >32K requests crash without it (issue #27).
#
# Kept from the validated 2026-08-30 config (absent from NVIDIA's command):
#   max-num-seqs 16 (NVIDIA 32, fleet seat cap), block-size 2304,
#   max-model-len 1048576 explicit, DFlash2 k=7 (drafter is CC BY-NC-ND;
#   MTP-1 - the checkpoint ships one nextn layer - is the commercial
#   fallback), served-model-name alias, clear_thinking=true, glm47 tool
#   parser, --enable-prefix-caching stated explicitly. Loader threads 16
#   (NVIDIA 128; GB10 has 20 cores).
# Reasoning arrives in message.reasoning; clients dial effort with
# chat_template_kwargs {"reasoning_effort": "low"|"high"|"max"}.
# 2026-09-11: this form has NOT been booted yet - first launch foreground.

recipe_version: "1"
name: GLM-5.3-Flash-NVFP4
description: GLM-5.3-Flash NVFP4 on 4x Spark - nvidia/GLM-5.3-Flash-NVFP4 with NVIDIA's official vLLM setup; image and topology adapted to GB10

model: nvidia/GLM-5.3-Flash-NVFP4
container: vllm-node-glm5.3-flash

cluster_only: true

mods:
  - mods/fix-glm53-topk-sm120
  # vLLM #54150: fused NvFp4 MoE drops w3's per-expert global scale when it
  # differs from w1's -> U+FFFD garble in Korean/emoji text. ModelOpt quants
  # (this one included) carry per-tensor amax scales, so gate/up differ.
  # Requantizes block scales onto a shared per-expert scale; patches the
  # ModelOpt loader path this checkpoint uses.
  - mods/fix-nvfp4-moe-global-scale
  # kpool tail slot-map clamp (silent corruption on generations >~2K tokens,
  # mechanism credited to vcruz305) + XGrammar termination backports.
  # Vendored from Mia's overlay; exonerated of side effects by the KV A/B.
  - mods/mia-backports-20260830

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.85
  max_model_len: 1048576
  max_num_seqs: 16
  block_size: 2304
  max_num_batched_tokens: 8192
  loader_threads: 16

env:
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  # Survival addition: Glm5NextProcessor open()s files relative to the model
  # argument; offline mode makes vLLM resolve the HF id to the local snapshot
  # first. tonyd2wild's launcher sets this too (plus TRANSFORMERS_OFFLINE).
  # Without it the API server crashes on processor_config.json at boot.
  HF_HUB_OFFLINE: "1"

# Flag order follows NVIDIA's command; GB10 and kept flags are appended.
command: |
  vllm serve nvidia/GLM-5.3-Flash-NVFP4 \
      --served-model-name glm-5.3-flash-nvfp4 \
      --trust-remote-code \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --enable-expert-parallel \
      --enable-ep-weight-filter \
      --reasoning-parser glm45 \
      --kv-cache-dtype fp8 \
      --model-loader-extra-config '{{"enable_multithread_load": true, "num_threads": {loader_threads}}}' \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --enable-chunked-prefill \
      --max-num-seqs {max_num_seqs} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --block-size {block_size} \
      --moe-backend marlin \
      --enable-prefix-caching \
      --tool-call-parser glm47 \
      --enable-auto-tool-choice \
      --speculative-config '{{"method":"dflash","model":"incoai/GLM-5.3-Flash-DFlash2","num_speculative_tokens":7,"draft_sample_method":"probabilistic","rejection_sample_method":"standard"}}' \
      --default-chat-template-kwargs '{{"clear_thinking": true}}'
