# GLM-5.3-Flash, LibertAIDAI NVFP4 (182 GiB), tonyd2wild patched image, TP=4.
# Flag set is kingjones30's GB10-validated recipe (24.7-30.3 tok/s, MTP-5).
#
# Image prep:
#   PREBUILT_RUNNER_IMAGE=ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v11-dflash2 \
#     ./build-and-copy.sh -t vllm-node-glm5.3-flash -c
#
# The base carries tonyd2wild's v1-v9 patch stack (NoPE-MLA backend, FA2 NaN,
# PDL race, uninitialized indexer top-k memory, fp8-KV tile) - the only
# TP4-validated NVFP4 image on GB10. The stock day-0 image needs runtime mods
# and still wedges at TP=4 (uninitialized indexer top-k: all ranks spin at 96%
# GPU in the first sparse-MLA dummy run). The image's DFlash2 overlay is
# inert under this MTP config; the CC BY-NC-ND DFlash2 drafter is NOT loaded.
#
# --moe-backend marlin is mandatory on sm_121: the auto-selected
# FLASHINFER_CUTLASS NvFp4 MoE backend produces silent garbage output.
# Background, gotchas, and tuning levers: docs/GLM53_FLASH.md

recipe_version: "1"
name: GLM-5.3-Flash-NVFP4
description: vLLM serving LibertAIDAI/GLM-5.3-Flash-NVFP4 on a 4x Spark cluster via tonyd2wild's patched sm121 image

model: LibertAIDAI/GLM-5.3-Flash-NVFP4
container: vllm-node-glm5.3-flash

cluster_only: true

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 1

command: |
  vllm serve LibertAIDAI/GLM-5.3-Flash-NVFP4 \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --kv-cache-dtype fp8_ds_mla \
      --language-model-only \
      --moe-backend marlin \
      --speculative-config '{{"method":"mtp","num_speculative_tokens":5}}' \
      --tool-call-parser glm47 --enable-auto-tool-choice \
      --reasoning-parser glm45
