# GLM-5.3-Flash production serving - 4x Spark TP4, every axis deliberate.
# Built 2026-08-30 from the benchmark campaign's evidence (docs/GLM53_FLASH.md);
# the -nvfp4/-exl3 recipes remain the benchmark-reference configs.
#
# Image prep (same image as the nvfp4 recipe):
#   PREBUILT_RUNNER_IMAGE=ghcr.io/tonyd2wild/vllm-glm53-flash:sm121-v11-dflash2 \
#     ./build-and-copy.sh -t vllm-node-glm5.3-flash -c
#
# Decision log (what changed vs the benchmark recipe, and why):
#   kv-cache-memory 24 GiB/rank pin: KEPT - A/B'd unpinned 2026-08-30:
#     unpinned gives 7.2M-token pool but degrades 131K retrieval (9/16 vs
#     25/25 pinned) and decode variance (+/-5.0 vs +/-0.5 tok/s).
#     Mechanism unknown; the pin is empirically load-bearing.
#   max_num_seqs 12 (was 6): fleet pattern from the ds4f campaign; pinned
#     pool = 3.9M tokens = ~14 sessions @262K. DFlash2 acceptance under
#     concurrent load is UNMEASURED - watch aggregate tok/s at c>4.
#   max_model_len 262144 (was 1048576): serving honesty - 131K is the
#     validated ceiling (RULER 1.0), 262K is headroom within the same
#     code path; the 1M window was never serve-tested past 131K.
#   prefix caching ON (was off): TTFT win for repeated system prompts.
#     Kpool manager caches block-aligned only (boot warns; expected).
#   thinking ON via chat template default (was disabled): serving default;
#     clients opt out per-request with chat_template_kwargs.
#   reasoning-parser deepseek_r1 (was glm45): per LibertAIDAI's model card
#     (2026-08-30): glm45 parsing is SGLang-only, vLLM needs deepseek_r1.
#     SMOKE-TEST reasoning_content separation before trusting in prod.
#   speculative sampling made EXPLICIT (probabilistic draft + standard
#     rejection, matching the exl3 recipe): distribution-preserving at
#     temperature>0; the benchmark recipe inherits engine defaults.
#     NOTE: DFlash2 drafter is CC BY-NC-ND (non-commercial).
#   enforce-eager KEPT: stability-first; graphs-on is the first tuning
#     A/B (expected +5-15% decode) once serving is soaked.
#   block-size 2304, batched-tokens 8192, marlin MoE, mp backend, fp8_e4m3
#     KV: tony's validated envelope, unchanged.
# GB10 REQUIRED mods: fix-glm53-topk-sm120 (>32K requests crash without it,
# issue #27); mia-backports (kpool long-generation corruption clamp +
# XGrammar termination - exonerated by the KV A/B, essential for >2K
# generations).

recipe_version: "1"
name: GLM-5.3-Flash-Serve
description: GLM-5.3-Flash NVFP4 production serving on 4x Spark - evidence-based config, 262K window, 12 seats, thinking on

model: LibertAIDAI/GLM-5.3-Flash-NVFP4
container: vllm-node-glm5.3-flash

cluster_only: true

mods:
  - mods/drop-caches
  - mods/fix-glm53-topk-sm120
  - mods/mia-backports-20260830

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_seqs: 12

env:
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  NCCL_IB_GID_INDEX: "3"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  HF_HUB_OFFLINE: "1"

command: |
  vllm serve LibertAIDAI/GLM-5.3-Flash-NVFP4 \
      --served-model-name glm-5.3-flash-serve \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --block-size 2304 \
      --max-num-batched-tokens 8192 \
      --kv-cache-dtype fp8_e4m3 \
      --kv-cache-memory 25769803776 \
      --enforce-eager \
      --enable-prefix-caching \
      --moe-backend marlin \
      --speculative-config '{{"method":"dflash","model":"incoai/GLM-5.3-Flash-DFlash2","num_speculative_tokens":7,"draft_sample_method":"probabilistic","rejection_sample_method":"standard"}}' \
      --tool-call-parser glm47 --enable-auto-tool-choice \
      --reasoning-parser deepseek_r1
