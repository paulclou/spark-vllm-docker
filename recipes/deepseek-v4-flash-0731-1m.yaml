# Recipe: DeepSeek V4 Flash 0731 - pinned 1M context
# DeepSeek V4 Flash using the B12X-optimized serving stack on an SM121 cluster

# Why this variant exists
#
# The base recipe leaves max_model_len at "auto", which vLLM turns into -1 and
# resolves with _auto_fit_max_model_len(): a binary search for the longest
# sequence that fits the KV pool on the limiting worker. Every boot of the base
# recipe logged a different answer, and never 1M:
#
#   Auto-fit max_model_len: reduced from 1048576 to 995328
#                                                 987136
#                                                 940288
#                                                 926720
#                                                 921856
#                                                 833792   <- worst observed
#
# So the advertised window was whatever memory happened to be free at boot,
# swinging ~20% across restarts. The model itself is a 1M model: config.json
# has max_position_embeddings 1048576 via YaRN factor 16 over
# original_max_position_embeddings 65536.
#
# Pinning max_model_len turns a shortfall into a boot failure instead of a
# silently shorter window. gpu_memory_utilization 0.85 -> 0.90 and max_num_seqs
# 8 -> 4 buy the headroom: the worst boot above needs +25.8% KV, the best +5.3%.
#
# If a boot still fails on KV capacity, in order:
#   1. mods/gpu-mem-util-gb + an absolute --gpu-memory-utilization-gb budget.
#      The fraction is measured against fluctuating free memory on a unified-
#      memory Spark, which is the likely cause of the spread above.
#   2. max_num_batched_tokens 8192 -> 4096.
# There is no KV-dtype lever: DeepSeek-V4 attention pins fp8_ds_mla at 584 B
# per token, and nvfp4_ds_mla is unreachable for this model (its own resolver
# asserts fp8, and V4_B12X_SPARSE lists fp8 only).
#
# MEASURED 2026-08-22 (2x DGX Spark GB10, TP=2, DSpark k=5, fp8_ds_mla KV)
#
# The pin works and it survives a reboot. Two boots, both advertising the full
# window, with the memory variance landing in spare headroom instead of in the
# context length:
#
#   boot 1   KV pool 1,779,018 tokens   1.70x concurrency at 1,048,576
#   boot 2   KV pool 1,977,584 tokens   1.89x concurrency at 1,048,576
#
# Decode, single stream, 1024 tokens, 3 runs per family (mean of all 15: 57.5):
#
#   prose        38.3 - 40.9 tok/s   accept_len 2.56 - 2.72
#   chat         36.7 - 68.9         accept_len 2.50 - 4.97
#   code         48.1 - 72.6         accept_len 3.27 - 5.17
#   repetitive   68.8 - 77.3         accept_len 4.80 - 5.61
#   peak         64.1 - 66.9         accept_len 4.49 - 4.78
#
# Spread inside a family is acceptance, not noise: identical code prompts ran
# 48 and 73 tok/s with accept_len 3.27 and 5.17. Quote a range, never a point.
#
# Decode does NOT decay with depth - the headline result of this recipe:
#
#        870 tok    65.97 tok/s   TTFT   0.9s   accept_len 4.68
#     56,190        36.70         TTFT  24.1s   accept_len 2.49
#    224,706        43.09         TTFT 139.0s   accept_len 2.98
#    928,582        48.43         TTFT 980.2s   accept_len 3.12
#
# 48 tok/s at 928k with acceptance still above 3 means the DSpark drafter keeps
# earning its passes 14x past the model's native 65,536-token YaRN window. That
# is the opposite of the Qwen3.8 MTP cliff (see qwen3.8-27b-nvfp4-1m.yaml, where
# acceptance goes to exactly zero past native), so do NOT copy the "drop
# speculation for long context" conclusion across model families - it is a
# property of the drafter, and DSA sparse attention is why decode holds up.
#
# What 1M actually costs is TTFT: 16.3 minutes to first token. Prefill rate
# peaks mid-range and decays - 411 tok/s at 6.9k, 888 at 27k, 2,147 at 86k,
# 1,929 at 225k, ~818 while loading the 928k prompt. 1M is a batch context, not
# an interactive one.
#
# Concurrency (max_num_seqs 4, 512 tokens): c1 30.3 tok/s, c2 28.4 aggregate /
# 20.0 per stream, c4 59.4 / 23.1. Aggregate is flat by c2, so this config is
# bandwidth-bound rather than batch-limited.
#
# Quality: tools/quality-probe.py scores 10/11 graded with static YaRN always on.
#
# OPEN: EMPTY COMPLETION AT ~449k
#
# A 449,406-token prompt returns completion_tokens=1, finish_reason "stop",
# empty text - the greedy first token is EOS. Reproducible: two different filler
# salts at that depth, identical result, temp 0. It is NOT monotonic in depth -
# 224,706 and 928,582 answer normally with the same prompt shape - and the
# server logs 200 OK with no engine error, so a client sees a silent empty
# answer. Unexplained; do not treat deep context as reliable until it is.
#
# NVFP4 KV IS NOT AN OPTION HERE - DO NOT RETRY IT
#
# Tested 2026-08-22: --kv-cache-dtype nvfp4_ds_mla dies in ~2s at config
# validation, before weights load:
#
#   ValueError: nvfp4 KV cache is not supported with MLA (Multi-head Latent
#   Attention) backends.
#
# The guard is VllmConfig.validate_nvfp4_kv_cache_with_mla -
# cache_dtype.startswith("nvfp4") and model_config.use_mla - so it rejects
# nvfp4, nvfp4_4over6 AND nvfp4_ds_mla for every MLA model, not just this one.
# It exists because vllm-project/vllm#43562 had NVFP4 KV boot clean on SM120 and
# then kill the engine on the first request; failing fast is the fix. The same
# error is reported for GLM-5.2-NVFP4 (HF discussions/1), so the 432 B/token
# nvfp4_ds_mla layout in B12xMLASparseBackend is unreachable for any MLA model
# on this image. fp8_ds_mla at 584 B/token is the floor for DeepSeek-V4, and
# gpu_memory_utilization plus max_num_seqs are the only context levers left.
#
# Third-party recipes advertising "1M NVFP4 KV" for this checkpoint delete that
# validator and then pin the page back to fp8's 584-byte envelope, so their KV
# is byte-identical to this recipe's while carrying a different dtype string.
# Their own notes record the real 416-byte layout failing past ~411 tokens.
#
# KNOWN RISK: vllm-project/vllm#40969 (open) reports DeepSeek-V4-Flash hanging
# after ~6 requests with cudagraph_mode=FULL_AND_PIECEWISE plus chunked prefill
# on SM 12.x, which is what this recipe runs. Not reproduced here across a
# multi-hour session and ~90 requests including four 200k+ prefills, but it is
# the most likely explanation for third-party reports of the b12x stack dying
# after 1-2 hours. Watch for it before trusting this recipe unattended.
#
# At 1M the pool holds one to two requests depending on the boot, so treat
# concurrency here as ~1. Use the base recipe for the concurrency suite.

recipe_version: "1"
name: DeepSeek-V4-Flash-0731-1M
description: DeepSeek-V4-Flash-0731 on a dual Spark at a pinned 1,048,576-token context

model: deepseek-ai/DeepSeek-V4-Flash-0731
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods:
  - mods/instanttensor-hybrid-draft-loader
#   - mods/drop-caches

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.90
  max_model_len: 1048576
  block_size: 256
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 64
  num_speculative_tokens: 5

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOE_SKIP_PADDING: "0"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}'
